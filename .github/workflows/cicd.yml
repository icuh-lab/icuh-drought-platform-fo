name: icuh-drought-platform-fo CI/CD

# develop 에 올라간 것이 곧 운영이다. main 은 없앴다.
#
# 기능 브랜치 → develop PR 이 머지되는 순간 배포가 시작된다. 릴리스 PR 단계가
# 없으므로 develop 에 머지하기 전에 검증을 끝내야 한다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: icuh-drought-platform-fo
  CONTAINER_NAME: icuh-drought-platform-fo
  DOCKER_NETWORK: web

jobs:
  verify:
    name: Lint and build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 순수 함수 검증 스크립트. 백엔드 없이 동작한다. 파일명을 하드코딩하면 새
      # 테스트 파일 추가나 리네임 때마다 이 목록도 같이 고쳐야 하는데 잊어버리기
      # 쉽다(실제로 한 번 겪음 — onion-price.test.mts가 vintage-price-series.test.mts로
      # 리네임되며 CI가 조용히 그 파일만 건너뛰지 않고 아예 죽었다). scripts/*.test.mts
      # 전체를 동적으로 순회해 이 문제 자체를 구조적으로 없앤다.
      - run: |
          set -e
          for f in scripts/*.test.mts; do
            echo "::group::$f"
            npx tsx "$f"
            echo "::endgroup::"
          done

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # 기본 docker 드라이버는 캐시 export 를 지원하지 않는다. 아래 cache-to 를 쓰려면
      # docker-container 드라이버가 필요하고, 그것을 만들어 주는 것이 이 액션이다.
      # 빠지면 "Cache export is not supported for the docker driver" 로 빌드가 죽는다.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SHA 태그를 함께 남겨야 문제 발생 시 이전 이미지로 되돌릴 수 있다.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다. 런타임 -e 로는 바꿀 수 없다.
          build-args: |
            NEXT_PUBLIC_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_OPEN_API_BASE_URL=${{ secrets.NEXT_PUBLIC_OPEN_API_BASE_URL }}
            NEXT_PUBLIC_OPEN_API_DEFAULT_YEAR=${{ vars.NEXT_PUBLIC_OPEN_API_DEFAULT_YEAR }}
            NEXT_PUBLIC_OPEN_API_DEFAULT_MONTH=${{ vars.NEXT_PUBLIC_OPEN_API_DEFAULT_MONTH }}
            NEXT_PUBLIC_AGRI_CABBAGE_LOCATION=${{ vars.NEXT_PUBLIC_AGRI_CABBAGE_LOCATION }}
            NEXT_PUBLIC_AGRI_ONION_LOCATION=${{ vars.NEXT_PUBLIC_AGRI_ONION_LOCATION }}
            NEXT_PUBLIC_HYDROPOWER_DAM_NAME=${{ vars.NEXT_PUBLIC_HYDROPOWER_DAM_NAME }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and replace container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker pull "$IMAGE"

            # 프록시와 같은 네트워크에 붙인다. 호스트 포트는 열지 않는다.
            docker network inspect ${{ env.DOCKER_NETWORK }} >/dev/null 2>&1 \
              || docker network create ${{ env.DOCKER_NETWORK }}

            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network ${{ env.DOCKER_NETWORK }} \
              "$IMAGE"

            # 기동 확인. 실패하면 배포를 실패로 표시한다.
            ok=0
            for i in $(seq 1 20); do
              if docker exec ${{ env.CONTAINER_NAME }} node -e \
                "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "기동 확인 실패. 로그:"
              docker logs --tail 50 ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            echo "기동 확인 완료"
            # 이전 SHA 이미지가 쌓이므로 참조되지 않는 것만 정리한다.
            docker image prune -f
